name: Platform CI/CD

on:
  push:
    branches:
      - master

permissions:
  contents: write

# ============================================================
# JOB 1: DETECT APPLICATION CHANGES
# ============================================================

jobs:

  detect-changes:

    runs-on: ubuntu-latest

    outputs:
      app: ${{ steps.detect.outputs.app }}
      build: ${{ steps.detect.outputs.build }}
      deleted_app: ${{ steps.detect.outputs.deleted_app }}

    steps:

      # ========================================================
      # CHECKOUT COMPLETE GIT HISTORY
      # ========================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ========================================================
      # DETECT CREATE / UPDATE / DELETE
      # ========================================================

      - name: Detect changes
        id: detect
        shell: bash
        run: |

          echo "=========================================="
          echo "       PLATFORM CHANGE DETECTION"
          echo "=========================================="

          BASE="${{ github.event.before }}"
          HEAD="${{ github.sha }}"

          echo "BASE: $BASE"
          echo "HEAD: $HEAD"


          # ====================================================
          # FIRST PUSH HANDLING
          # ====================================================

          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE=$(git rev-list --max-parents=0 HEAD)
          fi

          echo "Using BASE: $BASE"


          # ====================================================
          # GET CHANGED FILES
          # ====================================================

          FILES=$(git diff --name-only "$BASE" "$HEAD" 2>/dev/null || true)


          # ====================================================
          # FALLBACK DIFF
          # ====================================================

          if [ -z "$FILES" ]; then

            echo "Normal diff returned nothing."
            echo "Trying fallback diff..."

            FILES=$(git diff --name-only HEAD^ HEAD 2>/dev/null || true)

          fi


          echo ""
          echo "Changed files:"
          echo "------------------------------------------"

          if [ -n "$FILES" ]; then
            echo "$FILES"
          else
            echo "No changed files detected."
          fi

          echo "------------------------------------------"


          # ====================================================
          # DETECT APPLICATION
          # ====================================================

          APP=$(
            echo "$FILES" |
            grep '^applications/' |
            cut -d/ -f2 |
            sort -u |
            head -1 ||
            true
          )


          # ====================================================
          # DETECT DELETED APPLICATION
          # ====================================================

          DELETED_APP=$(
            git diff --name-status "$BASE" "$HEAD" 2>/dev/null |
            awk '
              $1 == "D" && $2 ~ /^applications\/[^\/]+\// {
                split($2, parts, "/");
                print parts[2];
              }
            ' |
            sort -u |
            head -1 ||
            true
          )


          # ====================================================
          # FALLBACK DELETION DETECTION
          # ====================================================

          if [ -z "$DELETED_APP" ]; then

            DELETED_APP=$(
              git diff --name-status HEAD^ HEAD 2>/dev/null |
              awk '
                $1 == "D" && $2 ~ /^applications\/[^\/]+\// {
                  split($2, parts, "/");
                  print parts[2];
                }
              ' |
              sort -u |
              head -1 ||
              true
            )

          fi


          # ====================================================
          # DETERMINE WHETHER IMAGE NEEDS TO BE BUILT
          # ====================================================

          BUILD=false


          # Deleted applications are NEVER built.

          if [ -n "$APP" ] && [ -z "$DELETED_APP" ]; then

            if echo "$FILES" | grep -Eq \
              "^applications/${APP}/app/|^applications/${APP}/Dockerfile|^applications/${APP}/app/requirements.txt"; then

              BUILD=true

            fi

          fi


          # ====================================================
          # GITHUB OUTPUTS
          # ====================================================

          echo "app=$APP" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "deleted_app=$DELETED_APP" >> "$GITHUB_OUTPUT"


          # ====================================================
          # DISPLAY RESULT
          # ====================================================

          echo ""
          echo "=========================================="
          echo "Application : $APP"
          echo "Build       : $BUILD"
          echo "Deleted App : $DELETED_APP"
          echo "=========================================="


  # ============================================================
  # JOB 2:
  # SECURITY + BUILD + TRIVY + SBOM + PUSH + HELM
  # ============================================================

  build-and-deploy:

    needs: detect-changes

    if: |
      needs.detect-changes.outputs.app != '' &&
      needs.detect-changes.outputs.build == 'true' &&
      needs.detect-changes.outputs.deleted_app == ''

    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      APP: ${{ needs.detect-changes.outputs.app }}
      IMAGE: aleemahmad2/${{ needs.detect-changes.outputs.app }}:${{ github.sha }}

    steps:

      # ========================================================
      # 1. CHECKOUT
      # ========================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ========================================================
      # 2. SETUP PYTHON
      # ========================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ========================================================
      # 3. INSTALL BANDIT
      # ========================================================

      - name: Install Bandit
        run: |

          echo "=========================================="
          echo "             INSTALLING BANDIT"
          echo "=========================================="

          python -m pip install --upgrade pip

          pip install bandit

          bandit --version


      # ========================================================
      # 4. BANDIT SECURITY SCAN
      # ========================================================

      - name: Run Bandit security scan
        continue-on-error: true
        run: |

          echo "=========================================="
          echo "             BANDIT SECURITY SCAN"
          echo "=========================================="

          mkdir -p security-reports

          bandit \
            -r "applications/${APP}/app" \
            -ll \
            -f txt \
            -o security-reports/bandit-report.txt

          echo ""
          echo "Bandit scan completed."

          if [ -f security-reports/bandit-report.txt ]; then
            cat security-reports/bandit-report.txt
          fi


      # ========================================================
      # 5. UPLOAD BANDIT REPORT
      # ========================================================

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP }}-bandit-report
          path: security-reports/bandit-report.txt
          if-no-files-found: warn


      # ========================================================
      # 6. SETUP DOCKER BUILDX
      # ========================================================

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # ========================================================
      # 7. LOGIN TO DOCKER HUB
      # ========================================================

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}


      # ========================================================
      # 8. BUILD DOCKER IMAGE
      # ========================================================

      - name: Build Docker Image
        run: |

          echo "=========================================="
          echo "           BUILDING DOCKER IMAGE"
          echo "=========================================="

          echo "Image:"
          echo "$IMAGE"

          docker build \
            --provenance=false \
            --sbom=false \
            -t "$IMAGE" \
            "applications/${APP}/app"

          echo ""
          echo "Docker image built successfully."


          # Verify image exists locally

          docker image inspect "$IMAGE" > /dev/null

          echo "Image exists locally."


      # ========================================================
      # 9. INSTALL TRIVY
      # ========================================================

      - name: Install Trivy
        run: |

          echo "=========================================="
          echo "             INSTALLING TRIVY"
          echo "=========================================="

          sudo apt-get update

          sudo apt-get install -y \
            wget \
            apt-transport-https \
            gnupg


          wget -qO - \
            https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null


          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] \
          https://aquasecurity.github.io/trivy-repo/deb \
          generic main" \
          | sudo tee /etc/apt/sources.list.d/trivy.list


          sudo apt-get update

          sudo apt-get install -y trivy


          echo ""
          echo "Trivy version:"

          trivy --version


      # ========================================================
      # 10. TRIVY VULNERABILITY SCAN
      #
      # IMPORTANT:
      # Vulnerabilities are reported.
      # Pipeline DOES NOT stop.
      # ========================================================

      - name: Trivy vulnerability scan
        continue-on-error: true
        run: |

          echo "=========================================="
          echo "          TRIVY SECURITY SCAN"
          echo "=========================================="

          mkdir -p security-reports


          echo ""
          echo "Scanning image:"
          echo "$IMAGE"


          # ====================================================
          # TABLE REPORT
          # ====================================================

          echo ""
          echo "Generating table report..."


          trivy image \
            --severity CRITICAL,HIGH \
            --format table \
            "$IMAGE" \
            | tee security-reports/trivy-report.txt


          # ====================================================
          # JSON REPORT
          # ====================================================

          echo ""
          echo "Generating JSON report..."


          trivy image \
            --severity CRITICAL,HIGH \
            --format json \
            --output security-reports/trivy-report.json \
            "$IMAGE"


          echo ""
          echo "Trivy scan completed."


          echo ""
          echo "Generated reports:"

          ls -lh security-reports/


      # ========================================================
      # 11. UPLOAD TRIVY REPORT
      # ========================================================

      - name: Upload Trivy vulnerability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP }}-trivy-security-report
          path: security-reports/trivy-report.*
          if-no-files-found: warn


      # ========================================================
      # 12. GENERATE SBOM WITH SYFT
      # ========================================================

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}
          format: cyclonedx-json
          output-file: ${{ env.APP }}-sbom.json


      # ========================================================
      # 13. UPLOAD SBOM
      # ========================================================

      - name: Upload SBOM to GitHub Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP }}-sbom
          path: ${{ env.APP }}-sbom.json
          if-no-files-found: warn


      # ========================================================
      # 14. PUSH DOCKER IMAGE
      # ========================================================

      - name: Push Docker Image
        run: |

          echo "=========================================="
          echo "          PUSHING DOCKER IMAGE"
          echo "=========================================="

          echo "Pushing:"
          echo "$IMAGE"

          docker push "$IMAGE"

          echo ""
          echo "Docker image pushed successfully."


      # ========================================================
      # 15. GET IMMUTABLE IMAGE DIGEST
      # ========================================================

      - name: Get image digest
        id: digest
        shell: bash
        run: |

          echo "=========================================="
          echo "        GETTING IMAGE DIGEST"
          echo "=========================================="

          DIGEST=$(docker inspect \
            --format='{{index .RepoDigests 0}}' \
            "$IMAGE")


          if [ -z "$DIGEST" ]; then

            echo "ERROR: Could not determine image digest."

            exit 1

          fi


          echo "Immutable image:"
          echo "$DIGEST"


          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"


      # ========================================================
      # 16. INSTALL YQ
      # ========================================================

      - name: Install yq
        run: |

          echo "=========================================="
          echo "               INSTALLING YQ"
          echo "=========================================="

          sudo wget -q \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 \
            -O /usr/local/bin/yq


          sudo chmod +x /usr/local/bin/yq


          yq --version


      # ========================================================
      # 17. UPDATE HELM VALUES
      # ========================================================

      - name: Update Helm Values
        run: |

          echo "=========================================="
          echo "          UPDATING HELM VALUES"
          echo "=========================================="


          VALUES_FILE="applications/${APP}/helm/values.yaml"


          if [ ! -f "$VALUES_FILE" ]; then

            echo "ERROR: Helm values file not found:"
            echo "$VALUES_FILE"

            exit 1

          fi


          echo "Updating image repository..."


          yq -i \
            '.image.repository = "aleemahmad2/'"${APP}"'"' \
            "$VALUES_FILE"


          echo "Updating image tag..."


          yq -i \
            '.image.tag = "'"${{ github.sha }}"'"' \
            "$VALUES_FILE"


          echo ""
          echo "Updated values.yaml:"
          echo "------------------------------------------"


          cat "$VALUES_FILE"


          echo "------------------------------------------"


      # ========================================================
      # 18. COMMIT HELM UPDATE
      # ========================================================

      - name: Commit Updated Helm Values
        run: |

          echo "=========================================="
          echo "       COMMITTING HELM UPDATE"
          echo "=========================================="


          git config user.name "github-actions"

          git config user.email "github-actions@github.com"


          git add \
            "applications/${APP}/helm/values.yaml"


          if git diff --cached --quiet; then

            echo "No Helm changes to commit."

          else

            git commit \
              -m "Update ${APP} image to ${{ github.sha }}"

            echo "Helm values committed."

          fi


      # ========================================================
      # 19. PUSH HELM UPDATE
      # ========================================================

      - name: Push Helm Update
        run: |

          echo "=========================================="
          echo "          PUSHING HELM UPDATE"
          echo "=========================================="


          git push


          echo ""
          echo "Helm update pushed successfully."


  # ============================================================
  # JOB 3: DELETE APPLICATION
  # ============================================================

  delete-application:

    needs: detect-changes

    if: needs.detect-changes.outputs.deleted_app != ''

    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      DELETED_APP: ${{ needs.detect-changes.outputs.deleted_app }}

    steps:

      # ========================================================
      # 1. CHECKOUT
      # ========================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ========================================================
      # 2. SHOW DELETED APPLICATION
      # ========================================================

      - name: Show deleted application
        run: |

          echo "=========================================="
          echo "       APPLICATION DELETION DETECTED"
          echo "=========================================="


          echo "Deleted application:"
          echo "$DELETED_APP"


          echo "=========================================="


      # ========================================================
      # 3. REMOVE ARGO CD APPLICATION MANIFEST
      # ========================================================

      - name: Remove Argo CD Application manifest
        run: |

          ARGO_FILE="argocd/${DELETED_APP}-application.yaml"


          echo "Checking:"
          echo "$ARGO_FILE"


          if [ -f "$ARGO_FILE" ]; then

            echo "Argo CD manifest still exists."

            echo "Removing:"
            echo "$ARGO_FILE"

            rm -f "$ARGO_FILE"

          else

            echo "Argo CD manifest already deleted."

            echo "Nothing to remove."

          fi


      # ========================================================
      # 4. REMOVE REMAINING APPLICATION DIRECTORY
      # ========================================================

      - name: Remove remaining application directory
        run: |

          APP_DIR="applications/${DELETED_APP}"


          if [ -d "$APP_DIR" ]; then

            echo "Application directory still exists."

            echo "Removing:"
            echo "$APP_DIR"

            rm -rf "$APP_DIR"

          else

            echo "Application directory already deleted."

          fi


      # ========================================================
      # 5. COMMIT CLEANUP
      # ========================================================

      - name: Commit deletion cleanup
        run: |

          echo "=========================================="
          echo "       COMMITTING DELETION CLEANUP"
          echo "=========================================="


          git config user.name "github-actions"

          git config user.email "github-actions@github.com"


          git add -A


          if git diff --cached --quiet; then

            echo "=========================================="
            echo "No cleanup changes required."
            echo "Application deletion already exists in Git."
            echo "=========================================="

          else

            git commit \
              -m "Cleanup deleted application ${DELETED_APP}"

            echo "Cleanup commit created."

          fi


      # ========================================================
      # 6. PUSH CLEANUP SAFELY
      # ========================================================

      - name: Push deletion cleanup
        run: |

          echo "=========================================="
          echo "          PUSHING DELETION CLEANUP"
          echo "=========================================="


          if git log -1 --pretty=%B | grep -q \
            "Cleanup deleted application ${DELETED_APP}"; then

            echo "Pushing deletion cleanup..."


            if git push; then

              echo ""
              echo "Deletion cleanup pushed successfully."

            else

              echo ""
              echo "WARNING:"
              echo "Git push did not succeed."

              echo ""
              echo "The application deletion itself is already"
              echo "present in the original Git commit."

              echo ""
              echo "Continuing workflow successfully."

            fi

          else

            echo "No deletion cleanup commit exists."

            echo "Nothing to push."

          fi