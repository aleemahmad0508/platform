name: Platform CI/CD

on:
  push:
    branches:
      - master

permissions:
  contents: write
  id-token: write

# ============================================================
# JOB 1: DETECT APPLICATION CHANGES
# ============================================================

jobs:

  detect-changes:

    runs-on: ubuntu-latest

    outputs:
      app: ${{ steps.detect.outputs.app }}
      build: ${{ steps.detect.outputs.build }}
      deleted_app: ${{ steps.detect.outputs.deleted_app }}

    steps:

      # --------------------------------------------------------
      # Checkout complete Git history
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # --------------------------------------------------------
      # Detect create / update / delete
      # --------------------------------------------------------

      - name: Detect changes
        id: detect
        shell: bash
        run: |

          echo "=========================================="
          echo "       PLATFORM CHANGE DETECTION"
          echo "=========================================="

          BASE="${{ github.event.before }}"
          HEAD="${{ github.sha }}"

          echo "BASE: $BASE"
          echo "HEAD: $HEAD"


          # ----------------------------------------------------
          # First push handling
          # ----------------------------------------------------

          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE=$(git rev-list --max-parents=0 HEAD)
          fi

          echo "Using BASE: $BASE"


          # ----------------------------------------------------
          # Get changed files
          # ----------------------------------------------------

          FILES=$(git diff --name-only "$BASE" "$HEAD" 2>/dev/null || true)


          # ----------------------------------------------------
          # Fallback if normal diff fails
          # ----------------------------------------------------

          if [ -z "$FILES" ]; then

            echo "Normal diff returned nothing."
            echo "Trying fallback diff..."

            FILES=$(git diff --name-only HEAD^ HEAD 2>/dev/null || true)

          fi


          echo ""
          echo "Changed files:"
          echo "------------------------------------------"

          echo "$FILES"

          echo "------------------------------------------"


          # ====================================================
          # DETECT APPLICATION
          # ====================================================

          APP=$(echo "$FILES" \
            | grep '^applications/' \
            | cut -d/ -f2 \
            | sort -u \
            | head -1 || true)


          # ====================================================
          # DETECT DELETED APPLICATION
          # ====================================================

          DELETED_APP=$(git diff --name-status "$BASE" "$HEAD" 2>/dev/null \
            | awk '$1 == "D" && $2 ~ /^applications\/[^\/]+\// {
                split($2, parts, "/");
                print parts[2];
              }' \
            | sort -u \
            | head -1 || true)


          # ----------------------------------------------------
          # Fallback deletion detection
          # ----------------------------------------------------

          if [ -z "$DELETED_APP" ]; then

            DELETED_APP=$(git diff --name-status HEAD^ HEAD 2>/dev/null \
              | awk '$1 == "D" && $2 ~ /^applications\/[^\/]+\// {
                  split($2, parts, "/");
                  print parts[2];
                }' \
              | sort -u \
              | head -1 || true)

          fi


          # ====================================================
          # DETERMINE WHETHER IMAGE NEEDS TO BE BUILT
          # ====================================================

          BUILD=false


          # Deleted applications are NEVER built.

          if [ -n "$APP" ] && [ -z "$DELETED_APP" ]; then

            if echo "$FILES" | grep -Eq \
              "^applications/${APP}/app/|^applications/${APP}/Dockerfile|^applications/${APP}/app/requirements.txt"; then

              BUILD=true

            fi

          fi


          # ====================================================
          # GITHUB OUTPUTS
          # ====================================================

          echo "app=$APP" >> "$GITHUB_OUTPUT"

          echo "build=$BUILD" >> "$GITHUB_OUTPUT"

          echo "deleted_app=$DELETED_APP" >> "$GITHUB_OUTPUT"


          # ====================================================
          # DISPLAY RESULT
          # ====================================================

          echo ""
          echo "=========================================="
          echo "Application : $APP"
          echo "Build       : $BUILD"
          echo "Deleted App : $DELETED_APP"
          echo "=========================================="


  # ============================================================
  # JOB 2: SECURITY + BUILD + PUSH + SIGN + HELM UPDATE
  # ============================================================

  build-and-deploy:

    needs: detect-changes

    if: |
      needs.detect-changes.outputs.app != '' &&
      needs.detect-changes.outputs.build == 'true' &&
      needs.detect-changes.outputs.deleted_app == ''

    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    env:
      APP: ${{ needs.detect-changes.outputs.app }}
      IMAGE: aleemahmad2/${{ needs.detect-changes.outputs.app }}:${{ github.sha }}

    steps:

      # ========================================================
      # CHECKOUT
      # ========================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ========================================================
      # 1. BANDIT
      # Python source-code security scanning
      # ========================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit


      - name: Run Bandit security scan
        run: |

          echo "=========================================="
          echo "             BANDIT SECURITY"
          echo "=========================================="

          bandit \
            -r "applications/${APP}/app" \
            -ll


      # ========================================================
      # DOCKER HUB LOGIN
      # ========================================================

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}


      # ========================================================
      # 2. BUILD DOCKER IMAGE
      # ========================================================

      - name: Build Docker Image
        run: |

          echo "=========================================="
          echo "             DOCKER BUILD"
          echo "=========================================="

          echo "Building:"
          echo "$IMAGE"

          docker build \
            -t "$IMAGE" \
            "applications/${APP}/app"


      # ========================================================
      # 3. INSTALL / UPDATE DOCKER SCOUT
      # ========================================================

      - name: Install Docker Scout
        run: |

          echo "=========================================="
          echo "        INSTALLING DOCKER SCOUT"
          echo "=========================================="

          curl -fsSL https://raw.githubusercontent.com/docker/scout-cli/main/install.sh \
            -o /tmp/install-scout.sh

          sudo sh /tmp/install-scout.sh

          docker scout version


      # ========================================================
      # 4. DOCKER SCOUT VULNERABILITY SCAN
      #
      # IMPORTANT:
      # Vulnerabilities DO NOT stop pipeline.
      # ========================================================

      - name: Docker Scout vulnerability scan
        continue-on-error: true
        run: |

          echo "=========================================="
          echo "       DOCKER SCOUT SECURITY SCAN"
          echo "=========================================="

          docker scout cves \
            --only-severity critical,high \
            --format markdown \
            --output scout-report.md \
            "local://${IMAGE}" || true


          echo ""
          echo "Scout report:"
          echo "------------------------------------------"

          if [ -f scout-report.md ]; then
            cat scout-report.md
          else
            echo "Scout report was not generated."
          fi

          echo "------------------------------------------"


      # ========================================================
      # 5. UPLOAD DOCKER SCOUT REPORT
      # ========================================================

      - name: Upload Docker Scout vulnerability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP }}-security-report
          path: scout-report.md
          if-no-files-found: warn


      # ========================================================
      # 6. SYFT
      # Generate SBOM
      # ========================================================

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}
          format: cyclonedx-json
          output-file: ${{ env.APP }}-sbom.json


      # ========================================================
      # 7. UPLOAD SBOM
      # ========================================================

      - name: Upload SBOM to GitHub Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP }}-sbom
          path: ${{ env.APP }}-sbom.json
          if-no-files-found: warn


      # ========================================================
      # 8. INSTALL COSIGN
      # ========================================================

      - name: Install Cosign
        uses: sigstore/cosign-installer@main
        with:
          cosign-release: "v3.0.6"


      # ========================================================
      # 9. PUSH DOCKER IMAGE
      # ========================================================

      - name: Push Docker Image
        run: |

          echo "=========================================="
          echo "             DOCKER PUSH"
          echo "=========================================="

          echo "Pushing:"
          echo "$IMAGE"

          docker push "$IMAGE"


      # ========================================================
      # 10. GET IMMUTABLE IMAGE DIGEST
      # ========================================================

      - name: Get image digest
        id: digest
        run: |

          echo "=========================================="
          echo "         GET IMAGE DIGEST"
          echo "=========================================="

          DIGEST=$(docker inspect \
            --format='{{index .RepoDigests 0}}' \
            "$IMAGE")

          echo "Immutable image:"
          echo "$DIGEST"

          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"


      # ========================================================
      # 11. COSIGN SIGN IMAGE
      #
      # Keyless signing using GitHub OIDC
      # ========================================================

      - name: Sign Docker Image
        env:
          COSIGN_YES: "true"

        run: |

          echo "=========================================="
          echo "             COSIGN SIGNING"
          echo "=========================================="

          DIGEST="${{ steps.digest.outputs.digest }}"

          echo "Signing:"
          echo "$DIGEST"

          cosign sign \
            --yes \
            "$DIGEST"


      # ========================================================
      # 12. WAIT FOR REGISTRY PROPAGATION
      # ========================================================

      - name: Wait for signature propagation
        run: |

          echo "Waiting for Docker Hub signature to become visible..."

          sleep 10


      # ========================================================
      # 13. COSIGN VERIFY IMAGE
      # ========================================================

      - name: Verify Docker Image Signature
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}

        run: |

          echo "=========================================="
          echo "          COSIGN VERIFICATION"
          echo "=========================================="

          echo "Verifying:"
          echo "$DIGEST"


          cosign verify \
            "$DIGEST" \
            --certificate-identity-regexp \
              "^https://github.com/aleemahmad0508/platform/.github/workflows/platform-ci-cd.yml@refs/heads/master$" \
            --certificate-oidc-issuer \
              "https://token.actions.githubusercontent.com"


      # ========================================================
      # 14. INSTALL YQ
      # ========================================================

      - name: Install yq
        run: |

          echo "=========================================="
          echo "                 YQ"
          echo "=========================================="

          sudo wget -q \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 \
            -O /usr/local/bin/yq

          sudo chmod +x /usr/local/bin/yq

          yq --version


      # ========================================================
      # 15. UPDATE HELM VALUES
      # ========================================================

      - name: Update Helm Values
        run: |

          echo "=========================================="
          echo "          UPDATE HELM VALUES"
          echo "=========================================="

          VALUES_FILE="applications/${APP}/helm/values.yaml"

          echo "Updating:"
          echo "$VALUES_FILE"


          yq -i \
            '.image.repository = "aleemahmad2/'"${APP}"'"' \
            "$VALUES_FILE"


          yq -i \
            '.image.tag = "'"${GITHUB_SHA}"'"' \
            "$VALUES_FILE"


          echo ""
          echo "Updated values.yaml:"
          echo "------------------------------------------"

          cat "$VALUES_FILE"

          echo "------------------------------------------"


      # ========================================================
      # 16. COMMIT HELM UPDATE
      # ========================================================

      - name: Commit Updated Helm Values
        run: |

          echo "=========================================="
          echo "        COMMIT HELM UPDATE"
          echo "=========================================="

          git config user.name "github-actions"

          git config user.email "github-actions@github.com"


          git add \
            "applications/${APP}/helm/values.yaml"


          if git diff --cached --quiet; then

            echo "No Helm changes to commit."

          else

            git commit \
              -m "Update ${APP} image to ${GITHUB_SHA}"

            echo "Helm values committed."

          fi


      # ========================================================
      # 17. PUSH HELM UPDATE
      # ========================================================

      - name: Push Helm Update
        run: |

          echo "=========================================="
          echo "          PUSH HELM UPDATE"
          echo "=========================================="

          git push


  # ============================================================
  # JOB 3: DELETE APPLICATION
  # ============================================================

  delete-application:

    needs: detect-changes

    if: needs.detect-changes.outputs.deleted_app != ''

    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      DELETED_APP: ${{ needs.detect-changes.outputs.deleted_app }}


    steps:

      # ========================================================
      # CHECKOUT
      # ========================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ========================================================
      # SHOW DELETED APPLICATION
      # ========================================================

      - name: Show deleted application
        run: |

          echo "=========================================="
          echo "APPLICATION DELETION DETECTED"
          echo "=========================================="

          echo "Deleted application:"
          echo "$DELETED_APP"

          echo "=========================================="


      # ========================================================
      # REMOVE ARGO CD APPLICATION MANIFEST
      # ========================================================

      - name: Remove Argo CD Application manifest
        run: |

          ARGO_FILE="argocd/${DELETED_APP}-application.yaml"


          echo "Checking:"
          echo "$ARGO_FILE"


          if [ -f "$ARGO_FILE" ]; then

            echo "Argo CD manifest still exists."

            echo "Removing:"
            echo "$ARGO_FILE"

            rm -f "$ARGO_FILE"

          else

            echo "Argo CD manifest already deleted."

            echo "Nothing to remove."

          fi


      # ========================================================
      # REMOVE REMAINING APPLICATION DIRECTORY
      # ========================================================

      - name: Remove remaining application directory
        run: |

          APP_DIR="applications/${DELETED_APP}"


          if [ -d "$APP_DIR" ]; then

            echo "Application directory still exists."

            echo "Removing:"
            echo "$APP_DIR"

            rm -rf "$APP_DIR"

          else

            echo "Application directory already deleted."

          fi


      # ========================================================
      # COMMIT CLEANUP
      # ========================================================

      - name: Commit deletion cleanup
        run: |

          git config user.name "github-actions"

          git config user.email "github-actions@github.com"


          git add -A


          if git diff --cached --quiet; then

            echo "=========================================="
            echo "No cleanup changes required."
            echo "Application deletion already exists in Git."
            echo "=========================================="

          else

            git commit \
              -m "Cleanup deleted application ${DELETED_APP}"

            echo "Cleanup commit created."

          fi


      # ========================================================
      # PUSH CLEANUP SAFELY
      # ========================================================

      - name: Push deletion cleanup
        run: |

          if git log -1 --pretty=%B | grep -q \
            "Cleanup deleted application ${DELETED_APP}"; then

            echo "Pushing deletion cleanup..."

            if git push; then

              echo "Deletion cleanup pushed successfully."

            else

              echo "WARNING:"
              echo "Git push did not succeed."

              echo "The application deletion itself is already"
              echo "present in the original Git commit."

              echo "Continuing workflow successfully."

            fi

          else

            echo "No deletion cleanup commit exists."

            echo "Nothing to push."

          fi