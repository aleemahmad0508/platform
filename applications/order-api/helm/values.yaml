app:
  name: order-api
  namespace: order-api

replicaCount: 3

image:
  repository: aleemahmad2/order-api
  tag: "v1"
  pullPolicy: IfNotPresent

container:
  port: 5000

service:
  type: ClusterIP
  port: 80
  targetPort: 5000

ingress:
  enabled: true
  className: nginx
  host: order-api.local

persistence:
  enabled: true
  storage: 1Gi

probe:
  interval: 30s