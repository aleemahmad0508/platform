apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule

metadata:
  name: {{ .Values.app.name }}-alert-rules
  namespace: monitoring
  labels:
    release: prometheus

spec:
  groups:
    - name: {{ .Values.app.name }}.rules

      rules:

        - alert: ApplicationDown
          expr: up{job="{{ .Values.app.name }}"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "{{ .Values.app.name }} application is down"
            description: "Prometheus cannot scrape one or more {{ .Values.app.name }} pods."

        - alert: HighCPUUsage
          expr: rate(container_cpu_usage_seconds_total{namespace="{{ .Values.app.namespace }}",container="{{ .Values.app.name }}"}[5m]) > 0.5
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "High CPU usage"
            description: "{{ .Values.app.name }} CPU usage is above 50%."

        - alert: HighMemoryUsage
          expr: container_memory_working_set_bytes{namespace="{{ .Values.app.namespace }}",container="{{ .Values.app.name }}"} > 500000000
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "High Memory usage"
            description: "{{ .Values.app.name }} memory usage exceeded 500MB."

        - alert: PodRestarting
          expr: increase(kube_pod_container_status_restarts_total{namespace="{{ .Values.app.namespace }}"}[5m]) > 0
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "Pod restarting"
            description: "One or more {{ .Values.app.name }} pods restarted."

        - alert: HighRequestRate
          expr: rate(flask_http_request_total[1m]) > 100
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "High request rate"
            description: "{{ .Values.app.name }} is receiving more than 100 requests/sec."