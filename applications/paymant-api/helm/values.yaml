app:
  name: paymant-api
  namespace: payment

replicaCount: 3

image:
  repository: aleemahmad2/payment
  tag: "v3"
  pullPolicy: IfNotPresent

container:
  port: 5000

service:
  type: ClusterIP
  port: 80
  targetPort: 5000

ingress:
  enabled: true
  className: nginx
  host: paymant-api.local

persistence:
  enabled: true
  storage: 1Gi

probe:
  interval: 30s