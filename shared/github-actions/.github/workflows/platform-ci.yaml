name: Platform CI/CD

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:

  detect-changes:
    runs-on: ubuntu-latest

    outputs:
      app: ${{ steps.detect.outputs.app }}

    steps:

      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - id: detect
        shell: bash
        run: |

          APP=$(git diff --name-only HEAD^ HEAD \
            | grep '^applications/' \
            | cut -d/ -f2 \
            | sort -u \
            | head -1)

          echo "Detected Application: $APP"

          echo "app=$APP" >> $GITHUB_OUTPUT

  build-and-deploy:

    needs: detect-changes

    if: needs.detect-changes.outputs.app != ''

    runs-on: ubuntu-latest

    env:
      APP: ${{ needs.detect-changes.outputs.app }}

    steps:

      - uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |

          docker build \
            -t aleemahmad2/${APP}:${{ github.sha }} \
            applications/${APP}/app

      - name: Push Docker Image
        run: |

          docker push \
            aleemahmad2/${APP}:${{ github.sha }}

      - name: Install yq
        run: |

          sudo wget -q https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/local/bin/yq

          sudo chmod +x /usr/local/bin/yq

      - name: Update Helm Values
        run: |

          yq -i '.image.repository = "aleemahmad2/'"${APP}"'"' \
            applications/${APP}/helm/values.yaml

          yq -i '.image.tag = "'"${{ github.sha }}"'"' \
            applications/${APP}/helm/values.yaml

      - name: Commit Changes
        run: |

          git config user.name github-actions
          git config user.email github-actions@github.com

          git add applications/${APP}/helm/values.yaml

          git commit -m "Update ${APP} image" || exit 0

          git push