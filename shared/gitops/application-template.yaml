apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: {{APP_NAME}}
  namespace: argocd

spec:
  project: default

  source:
    repoURL: {{REPO_URL}}
    targetRevision: master
    path: applications/{{APP_NAME}}/helm

  destination:
    server: https://kubernetes.default.svc
    namespace: {{NAMESPACE}}

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true