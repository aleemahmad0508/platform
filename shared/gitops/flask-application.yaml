apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: flask
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/aleemahmad0508/platform.git
    targetRevision: master
    path: templates/helm

  destination:
    server: https://kubernetes.default.svc
    namespace: flask

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true