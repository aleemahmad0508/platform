apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: payment-api
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/aleemahmad0508/platform.git
    targetRevision: master
    path: applications/payment-api/helm

  destination:
    server: https://kubernetes.default.svc
    namespace: payment

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true