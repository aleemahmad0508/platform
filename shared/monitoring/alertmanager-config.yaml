apiVersion: v1
kind: Secret

metadata:
  name: alertmanager-prometheus-kube-prometheus-alertmanager
  namespace: monitoring

stringData:

  alertmanager.yaml: |

    global:
      resolve_timeout: 5m

    route:
      group_by:
        - alertname

      group_wait: 30s

      group_interval: 5m

      repeat_interval: 1h

      receiver: slack


    receivers:

    - name: slack

      slack_configs:

      - api_url_file: /etc/alertmanager/secrets/slack-webhook/webhook

        channel: "#flask-alerts"

        send_resolved: true