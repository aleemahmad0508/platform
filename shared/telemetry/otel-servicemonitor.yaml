apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor

metadata:
  name: otel-collector
  namespace: observability
  labels:
    release: prometheus

spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector-collector

  namespaceSelector:
    matchNames:
      - observability

  endpoints:
    - port: prometheus
      path: /metrics
      interval: 15s