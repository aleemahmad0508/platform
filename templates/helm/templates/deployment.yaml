apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ .Values.app.name }}
  namespace: {{ .Values.app.namespace }}

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app: {{ .Values.app.name }}

  template:
    metadata:
      labels:
        app: {{ .Values.app.name }}

    spec:

      # ==========================================================
      # POD SECURITY CONTEXT
      # ==========================================================

      securityContext:
        runAsNonRoot: true


      # ==========================================================
      # CONTAINER
      # ==========================================================

      containers:

        - name: {{ .Values.app.name }}

          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"

          imagePullPolicy: {{ .Values.image.pullPolicy }}


          # ======================================================
          # CONTAINER SECURITY
          # ======================================================

          securityContext:
            privileged: false
            allowPrivilegeEscalation: false


          # ======================================================
          # PORT
          # ======================================================

          ports:

            - containerPort: {{ .Values.container.port }}


          # ======================================================
          # CPU + MEMORY
          # ======================================================

          resources:

            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"